<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traverent Bandung</title>
<link rel="icon" type="image/png" href="image/favico.png">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } }
</script>
<style>
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.7); }
    70% { transform: scale(1.06); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes checkSweep {
    from { stroke-dashoffset: 35; }
    to { stroke-dashoffset: 0; }
  }
  .anim-fade { animation: fadeUp .42s cubic-bezier(.22,1,.36,1) both; }
  .anim-pop { animation: popIn .48s cubic-bezier(.34,1.56,.64,1) both; }
  .anim-delay-1 { animation: fadeUp .42s cubic-bezier(.22,1,.36,1) .08s both; }
  .anim-delay-2 { animation: fadeUp .42s cubic-bezier(.22,1,.36,1) .16s both; }
  .anim-check path { stroke-dasharray: 35; stroke-dashoffset: 0; animation: checkSweep .55s ease-out .2s both; }
  @media (prefers-reduced-motion: reduce) {
    .anim-fade, .anim-pop, .anim-delay-1, .anim-delay-2, .anim-check path { animation: none !important; }
  }
</style>
<!-- Radius: hanya rounded (4px) dan rounded-md (6px) -->
</head>
<body class="bg-white font-sans text-neutral-900 antialiased">

<main id="app" class="mx-auto max-w-xl px-5 pb-24 pt-16"></main>

<!-- Demo: pindah antar layar. Hapus blok ini di versi asli. -->
<div class="fixed inset-x-0 bottom-0 border-t border-neutral-200 bg-white/90 px-4 py-2 text-center text-[11px] text-neutral-500 backdrop-blur">
  Demo: <a href="?step=dp" class="underline">Upload bukti DP</a> · <a href="?step=status" class="underline">Status pesanan</a> · <a href="?step=return" class="underline">Konfirmasi pengembalian</a>
</div>

<script src="demo-store.js"></script>
<script>
  const $ = id => document.getElementById(id), pad = n => String(n).padStart(2, '0');
  const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
  const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const dt = (off, t) => { const d = new Date(today); d.setDate(d.getDate() + off); d.setHours(+t.slice(0, 2), +t.slice(3)); return d; };
  const fd = d => `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]}`;
  const ft = d => `${fd(d)}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const rp = n => 'Rp ' + n.toLocaleString('id-ID');
  const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const DP_AMOUNT = 100000;
  const BANK = 'BCA 1234567890 a.n. Traverent Bandung';   // GANTI dengan rekening tujuan yang asli

  // ---------- DEMO: data dummy, di produksi ambil dari backend berdasarkan ID order ----------
  const RATES = {
    'Honda New Beat': [[85000, 95000], [105000, 120000], [10000, 15000]],
    'Honda New Vario': [[105000, 115000], [130000, 145000], [15000, 20000]],
    'Yamaha New Gear': [[95000, 105000], [115000, 130000], [10000, 15000]]
  };
  const ORDERS = {
    'ORD-29102': { nama: 'Rizky Pratama', unit: 'Honda New Beat', s: dt(3, '09:00'), e: dt(6, '17:00'), alamat: 'Hotel Grand Asia, Jl. Braga No. 12, Bandung' },
    'ORD-29101': { nama: 'Siti Nurhaliza', unit: 'Honda Vario 125', s: dt(2, '08:00'), e: dt(4, '18:00'), alamat: 'Cihampelas Inn, Jl. Cihampelas No. 88, Bandung' },
    'ORD-29098': { nama: 'Andre Wijaya', unit: 'Yamaha Gear 125', s: dt(1, '10:00'), e: dt(3, '16:00'), alamat: 'Hotel Dago Suites, Jl. Ir. H. Juanda No. 45, Bandung' },
    'ORD-29095': { nama: 'Dewi Lestari', unit: 'Honda Scoopy', s: dt(1, '09:00'), e: dt(2, '19:00'), alamat: 'Hotel Pasteur Inn, Jl. Dr. Djundjunan No. 7, Bandung' },
    'ORD-29090': { nama: 'Budi Santoso', unit: 'Honda Beat Street', s: dt(0, '13:00'), e: dt(2, '13:00'), alamat: 'Homestay Lembang Asri, Jl. Raya Lembang No. 101' },
    'ORD-29087': { nama: 'Maya Putri', unit: 'Honda Vario 160', s: dt(4, '09:00'), e: dt(5, '17:00'), alamat: 'Apartemen Taman Sari, Jl. Taman Sari No. 20, Bandung' }
  };
  const isWE = d => [0, 5, 6].includes(d.getDay());
  function total(o) {   // tarif sama dengan halaman admin
    const [wd, we, ex] = RATES[o.unit] || [[95000, 105000], [115000, 130000], [10000, 15000]];
    const rate = (d, i) => (isWE(d) ? we : wd)[i];
    const extraRate = d => (isWE(d) ? (ex ? ex[1] : 15000) : (ex ? ex[0] : 10000));
    const ms = o.e - o.s, days = Math.floor(ms / 864e5), r = Math.ceil((ms - days * 864e5) / 36e5); let sum = 0;
    for (let i = 0; i < days; i++) { const d = new Date(o.s); d.setDate(d.getDate() + i); sum += rate(d, 1); }
    if (r > 0) { const d = new Date(o.s); d.setDate(d.getDate() + days); sum += r <= 3 ? r * extraRate(d) : r <= 12 ? rate(d, 0) : rate(d, 1); }
    return sum;
  }

  // ---------- Layar yang dipilih dari link ----------
  try {
    const store = window.TraverentDemo && window.TraverentDemo.load();
    if (store) {
      if (store.RATES) Object.assign(RATES, store.RATES);
      (store.ORDERS || []).forEach(ord => {
        ORDERS[ord.id] = { nama: ord.nama, unit: ord.unit, s: new Date(ord.s), e: new Date(ord.e), alamat: ord.alamat };
      });
    }
  } catch (_) {}
  const qs = new URLSearchParams(location.search), href = decodeURIComponent(location.href);
  const oid = qs.get('order') || (href.match(/ORD-\d+/) || ['ORD-29102'])[0];
  const step = qs.get('step') || (/pengembalian|return|kembali/i.test(location.pathname) ? 'return' : 'dp');   // link DP vs link pengembalian
  const o = ORDERS[oid];
  let view = 'form', file = null, err = '';

  // ---------- Komponen ----------
  const row = (l, v) => `<div class="flex justify-between gap-6 border-b border-neutral-200 py-4 text-sm last:border-0"><span class="shrink-0 text-neutral-400">${l}</span><span class="text-right text-neutral-900">${esc(v)}</span></div>`;
  const summary = rows => `<section class="rounded-md bg-neutral-50 px-6">${rows.map(r => row(...r)).join('')}</section>`;
  const badge = () => {   // lencana bergelombang + centang
    const n = 8, R = 44, A = 5, pts = [];
    for (let i = 0; i < 120; i++) { const t = i / 120 * 2 * Math.PI, r = R + A * Math.cos(n * t); pts.push((r * Math.cos(t)).toFixed(1) + ',' + (r * Math.sin(t)).toFixed(1)); }
    return `<svg viewBox="-52 -52 104 104" class="h-24 w-24 anim-pop anim-check"><polygon points="${pts.join(' ')}" class="fill-lime-200"/><path d="M-15 2l10 10 21-25" fill="none" class="stroke-green-900" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  };
  const done = (title, sub) => `<div class="anim-fade flex min-h-[70vh] flex-col items-center justify-center text-center">${badge()}<h1 class="anim-delay-1 mt-8 text-3xl font-medium tracking-tight sm:text-4xl">${title}</h1><p class="anim-delay-2 mt-3 max-w-sm text-sm leading-relaxed text-neutral-500">${sub}</p></div>`;
  const imgIcon = '<svg class="h-8 w-8 text-neutral-300" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>';
  const PRIMARY = 'inline-flex items-center justify-center gap-2 rounded-md bg-blue-600 px-6 py-3.5 text-sm font-medium text-white hover:bg-blue-700';
  const OUTLINE = 'inline-flex items-center justify-center gap-2 rounded-md border border-neutral-200 bg-white px-5 py-3 text-sm font-medium hover:bg-neutral-50';

  // ---------- Layar 1: upload bukti DP ----------
  function dpScreen() {
    if (view === 'done') return done('Bukti DP sudah terkirim', 'Kami akan memeriksa bukti DP kamu dan menghubungi lewat WhatsApp untuk konfirmasi pengantaran motor.');
    const t = total(o);
    return `<div class="anim-fade">
      <h1 class="text-4xl font-medium tracking-tight">#${oid}</h1>
      <p class="mt-2 text-sm text-neutral-500">Halo ${esc(o.nama.split(' ')[0])}, lakukan pembayaran DP lalu unggah bukti transfernya di sini.</p>
      <div class="anim-delay-1 mt-6">${summary([
        ['Penyewa', o.nama], ['Unit', o.unit], ['Periode sewa', `${fd(o.s)} – ${fd(o.e)}`],
        ['Transfer ke', BANK], ['DP yang harus dibayar', rp(DP_AMOUNT)], ['Total sewa', rp(t)], ['Sisa (dibayar saat pengembalian)', rp(t - DP_AMOUNT)]
      ])}</div>
      <section class="anim-delay-2 mt-4 rounded-md bg-neutral-100 px-6 py-8 text-center">
        ${file
          ? `<img src="${file.url}" alt="Bukti DP" class="anim-pop mx-auto max-h-72 max-w-full rounded-md object-contain shadow-sm"><p class="mt-4 truncate text-sm font-medium">${esc(file.name)}</p>`
          : `<div class="relative mx-auto h-36 w-56">
              <div class="absolute left-2 top-6 h-28 w-24 -rotate-6 rounded-md bg-white shadow-sm"></div>
              <div class="absolute right-2 top-6 h-28 w-24 rotate-6 rounded-md bg-white shadow-sm"></div>
              <div class="absolute left-1/2 top-0 grid h-32 w-24 -translate-x-1/2 place-items-center rounded-md bg-white shadow">${imgIcon}</div></div>
            <h2 class="mt-6 text-xl font-semibold">Belum ada bukti DP</h2>
            <p class="mx-auto mt-2 max-w-xs text-sm leading-relaxed text-neutral-400">Unggah foto atau tangkapan layar bukti transfer DP sebesar ${rp(DP_AMOUNT)} agar pesananmu bisa kami proses.</p>`}
        ${err ? `<p class="mt-3 text-xs text-red-600">${err}</p>` : ''}
        <div class="mt-5 flex flex-wrap justify-center gap-2">
          <button type="button" data-pick class="${OUTLINE}"><svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>${file ? 'Ganti foto' : 'Unggah bukti'}</button>
          ${file ? `<button type="button" data-send class="${PRIMARY}">Kirim bukti DP</button>` : ''}
        </div>
        <input id="f" type="file" accept="image/*" class="hidden">
      </section>
    </div>`;
  }

  // ---------- Layar 2: status pesanan customer ----------
  function statusScreen() {
    const t = total(o);
    return `<div class="anim-fade">
      <div class="flex items-center gap-3">
        <span class="anim-pop grid h-12 w-12 shrink-0 place-items-center rounded-full bg-blue-50 text-blue-600">
          <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
        </span>
        <div>
          <h1 class="text-3xl font-medium tracking-tight sm:text-4xl">#${oid}</h1>
          <p class="text-xs text-neutral-500">Status pesanan kamu di Traverent Bandung</p>
        </div>
      </div>
      <div class="anim-delay-1 mt-6">${summary([
        ['Penyewa', o.nama], ['Unit', o.unit], ['Periode sewa', `${fd(o.s)} – ${fd(o.e)}`],
        ['Alamat pengantaran', o.alamat],
        ['Status DP', 'Diterima & Terverifikasi'],
        ['Total sewa', rp(t)],
        ['Status unit', 'Siap diantar sesuai jadwal']
      ])}</div>
      <div class="anim-delay-2 mt-6 rounded-md border border-blue-200 bg-blue-50 p-4 text-xs leading-relaxed text-blue-900 shadow-sm">
        <p class="font-semibold text-blue-950">Motor siap diantar oleh kru kami</p>
        <p class="mt-1">Kru Traverent Bandung akan menghubungi via WhatsApp menjelang waktu pengantaran. Pastikan membawa KTP asli saat serah terima unit.</p>
      </div>
    </div>`;
  }

  // ---------- Layar 3: konfirmasi pengembalian ----------
  function returnScreen() {
    if (view === 'done') return done('Terima kasih sudah menyewa di Traverent', 'Pengembalian motor sudah kami catat. Kami akan memeriksa kondisi unit dan menghubungi kamu bila ada hal yang perlu dikonfirmasi.');
    const t = total(o);
    return `<div class="anim-fade">
      <h1 class="text-4xl font-medium tracking-tight">#${oid}</h1>
      <p class="mt-2 text-sm text-neutral-500">Konfirmasi setelah motor diserahkan kepada kru Traverent.</p>
      <div class="anim-delay-1 mt-6">${summary([
        ['Penyewa', o.nama], ['Unit', o.unit], ['Periode sewa', `${fd(o.s)} – ${fd(o.e)}`], ['Jadwal kembali', ft(o.e)],
        ['Lokasi pengambilan', o.alamat], ['DP dibayar', rp(DP_AMOUNT)], ['Total sewa', rp(t)], ['Sisa pembayaran (ke kru)', rp(t - DP_AMOUNT)]
      ])}</div>
      <p class="anim-delay-2 mt-4 text-xs leading-relaxed text-neutral-400">Dengan menekan tombol di bawah, kamu menyatakan motor beserta kelengkapannya (kunci, helm, jas hujan, gembok) sudah diserahkan kepada kru kami. Sisa pembayaran dibayarkan langsung kepada kru saat serah terima.</p>
      <div class="anim-delay-2 mt-6 flex justify-center"><button type="button" data-return class="${PRIMARY} w-full max-w-sm">Konfirmasi pengembalian <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></button></div>
    </div>`;
  }

  function render() {
    $('app').innerHTML = !o
      ? `<h1 class="text-2xl font-medium">Order tidak ditemukan</h1><p class="mt-2 text-sm text-neutral-500">Periksa kembali link dari Traverent Bandung atau hubungi admin lewat WhatsApp.</p>`
      : step === 'return' ? returnScreen() : step === 'status' ? statusScreen() : dpScreen();
    if (view === 'done') window.scrollTo(0, 0);
  }

  // ---------- Event ----------
  document.addEventListener('click', e => {
    if (e.target.closest('[data-pick]')) $('f').click();
    if (e.target.closest('[data-send]')) {
      try { if (window.TraverentDemo) window.TraverentDemo.submitDP(oid, file ? file.url : '', DP_AMOUNT); } catch (_) {}
      view = 'done'; render();
    }
    if (e.target.closest('[data-return]')) {
      try { if (window.TraverentDemo) window.TraverentDemo.confirmReturnByCustomer(oid); } catch (_) {}
      view = 'done'; render();
    }
  });
  document.addEventListener('change', e => {
    const f = e.target.id === 'f' && e.target.files[0]; if (!f) return;
    if (!f.type.startsWith('image/') || f.size > 5e6) { err = 'Unggah gambar (JPG/PNG) maksimal 5 MB.'; render(); return; }
    const r = new FileReader(); r.onload = () => { file = { name: f.name, url: r.result }; err = ''; render(); }; r.readAsDataURL(f);
  });
  render();
</script>
</body>
</html>
