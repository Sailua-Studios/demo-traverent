<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Admin | Traverent Bandung</title>
<link rel="icon" type="image/png" href="../image/favico.png">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } }
</script>
<style>
  @keyframes fade-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .anim-in { animation: fade-up .4s cubic-bezier(.22,1,.36,1) both; }
  .anim-delay { animation-delay: .08s; }
  @media (prefers-reduced-motion: reduce) { .anim-in { animation: none; } }
</style>
</head>
<body class="min-h-screen bg-white font-sans text-neutral-900 antialiased">

  <main class="grid h-screen w-full overflow-hidden lg:grid-cols-2">

    <!-- ============ KOLOM KIRI: FORM LOGIN ============ -->
    <div class="flex flex-col justify-center px-6 py-12 sm:px-14 lg:px-20">
      <div class="anim-in mx-auto w-full max-w-sm">

        <!-- Brand Traverent -->
        <div class="mb-8 flex items-center gap-3">
          <img src="../image/favico.png" alt="Traverent Bandung" class="h-10 w-10 shrink-0 rounded-md object-cover">
          <div>
            <p class="text-sm font-semibold leading-tight">Traverent</p>
            <p class="text-[11px] text-neutral-500">Admin Bandung</p>
          </div>
        </div>

        <h1 class="text-2xl font-semibold tracking-tight text-neutral-900 sm:text-3xl">Selamat datang kembali</h1>
        <p class="mt-1.5 text-sm text-neutral-500">Silakan masukkan email dan password admin.</p>

        <form id="login-form" novalidate class="mt-7 space-y-4">
          <!-- Input Email -->
          <div>
            <label for="email" class="block text-xs font-medium text-neutral-700">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="admin@traverent.id"
              class="mt-1.5 w-full rounded-md border border-neutral-200 bg-white px-3.5 py-2.5 text-sm text-neutral-900 outline-none placeholder:text-neutral-400 focus:border-blue-600 focus:ring-2 focus:ring-blue-300">
          </div>

          <!-- Input Password + Toggle Visibility -->
          <div>
            <label for="password" class="block text-xs font-medium text-neutral-700">Password</label>
            <div class="relative mt-1.5">
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••"
                class="w-full rounded-md border border-neutral-200 bg-white py-2.5 pl-3.5 pr-10 text-sm text-neutral-900 outline-none placeholder:text-neutral-400 focus:border-blue-600 focus:ring-2 focus:ring-blue-300">
              <button type="button" id="toggle-pw" aria-label="Tampilkan password"
                class="absolute inset-y-0 right-0 flex items-center px-3 text-neutral-400 hover:text-neutral-600">
                <!-- Ikon Mata Tertutup (default) -->
                <svg id="ic-eye-off" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
                <!-- Ikon Mata Terbuka -->
                <svg id="ic-eye" class="hidden h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Remember & Lupa Password -->
          <div class="flex items-center justify-between pt-0.5">
            <label class="flex cursor-pointer items-center gap-2 text-xs text-neutral-600">
              <input id="remember" type="checkbox" class="h-3.5 w-3.5 rounded accent-blue-600">
              <span>Ingat saya 30 hari</span>
            </label>
            <button type="button" id="forgot-btn" class="text-xs font-medium text-neutral-700 hover:text-blue-600">Lupa password?</button>
          </div>

          <!-- Pesan Validasi / Info -->
          <p id="form-msg" role="alert" class="hidden rounded-md px-3 py-2.5 text-xs"></p>

          <!-- Tombol Masuk -->
          <button type="submit" class="mt-2 w-full rounded-md bg-blue-600 px-4 py-2.5 text-sm font-medium text-white transition-colors hover:bg-blue-700">
            Masuk
          </button>
        </form>

      </div>
    </div>

    <!-- ============ KOLOM KANAN: COVER IMAGE ============ -->
    <div class="hidden h-full p-3 lg:block">
      <div class="h-full w-full rounded-md bg-neutral-100 bg-cover bg-center" style="background-image:url('../image/bg-login.jpg')"></div>
    </div>

  </main>

<script src="../demo-store.js"></script>
<script>
  const ADMIN_URL = 'dashboard.html';
  const ADMIN_AUTH_KEY = 'traverent_admin_session';
  try {
    if (localStorage.getItem(ADMIN_AUTH_KEY)) location.replace(ADMIN_URL);
  } catch (_) {}

  const $ = id => document.getElementById(id);
  const emailEl = $('email'), pwEl = $('password'), msgEl = $('form-msg');

  function showMsg(text, type = 'error') {
    msgEl.textContent = text;
    msgEl.className = `rounded-md px-3 py-2.5 text-xs ${type === 'error' ? 'bg-red-50 text-red-700' : 'bg-blue-50 text-blue-900'}`;
    msgEl.classList.remove('hidden');
  }

  // Toggle tampilkan / sembunyikan password
  $('toggle-pw').addEventListener('click', () => {
    const show = pwEl.type === 'password';
    pwEl.type = show ? 'text' : 'password';
    $('ic-eye-off').classList.toggle('hidden', show);
    $('ic-eye').classList.toggle('hidden', !show);
    $('toggle-pw').setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
  });

  // Info lupa password
  $('forgot-btn').addEventListener('click', () => {
    showMsg('Hubungi pengelola utama Traverent Bandung untuk mengatur ulang password admin.', 'info');
  });

  // Submit form login
  $('login-form').addEventListener('submit', e => {
    e.preventDefault();
    const email = emailEl.value.trim();
    const pw = pwEl.value;

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      emailEl.focus();
      return showMsg('Masukkan alamat email admin yang valid.');
    }
    if (!pw) {
      pwEl.focus();
      return showMsg('Masukkan password admin terlebih dahulu.');
    }

    // Simpan sesi login demo dan redirect ke halaman admin
    try {
      localStorage.setItem(ADMIN_AUTH_KEY, JSON.stringify({ email, loggedInAt: new Date().toISOString() }));
    } catch (_) {}
    location.href = ADMIN_URL;
  });
</script>
</body>
</html>
